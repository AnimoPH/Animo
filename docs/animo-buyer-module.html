<!DOCTYPE html>
<html lang="fil">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Animo Buyer module</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --app:#faf8f4;--card:#ffffff;--muted:#f2efe8;
  --brand:#1a6e1e;--brand-d:#0f4a13;--brand-900:#112914;--brand-500:#558b2f;--brand-200:#c8e6c9;--brand-50:#e8f5e9;
  --ink:#1c1b18;--ink2:#4a4740;--ink3:#67635a;--line:#e6e2d8;--line2:#d3cec1;--strong:#857f72;
  --danger:#d32f2f;--danger-d:#a52121;--danger-bg:#fdecea;
  --warn:#f9a825;--warn-fg:#7a4b00;--warn-bg:#fff4d6;
  --caut:#f57c00;--caut-fg:#a34200;--caut-bg:#ffe9d6;
  --r-sm:12px;--r-md:16px;--r-lg:20px;--r-xl:28px;
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--font);background:#e9e5da;color:var(--ink);font-size:16px;line-height:24px}
button{font-family:inherit;cursor:pointer;color:inherit}
input,textarea{font-family:inherit}
.stage{min-height:100%;display:flex;gap:32px;align-items:flex-start;justify-content:center;padding:24px}
.index{width:250px;position:sticky;top:24px;background:#fff;border:2px solid var(--line);border-radius:var(--r-xl);padding:16px;max-height:calc(100vh - 48px);overflow:auto}
.index h1{font-size:18px;line-height:24px;font-weight:800;margin-bottom:4px}
.index p{font-size:14px;line-height:20px;color:var(--ink3);margin-bottom:12px}
.index h2{font-size:14px;line-height:16px;font-weight:700;color:var(--ink3);margin:14px 0 6px}
.index button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:8px 10px;font-size:14px;line-height:20px;font-weight:600;color:var(--ink2)}
.index button:hover{background:var(--muted)}
.index button.on{background:var(--brand-50);color:var(--brand)}
.phone{width:393px;height:852px;flex:none;background:var(--app);border-radius:48px;border:10px solid #1c1b18;box-shadow:0 30px 60px rgba(28,27,24,.25);position:relative;overflow:hidden;display:flex;flex-direction:column}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;position:relative}
.screen::-webkit-scrollbar{display:none}
.status{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:15px;font-weight:700;position:absolute;top:0;left:0;right:0;z-index:5;pointer-events:none}
.status.light{color:#fff}
.dyn{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:110px;height:30px;background:#1c1b18;border-radius:20px;z-index:6}
.pad{padding:16px}
.col{display:flex;flex-direction:column}
.row{display:flex;align-items:center}
.gap4{gap:4px}.gap8{gap:8px}.gap12{gap:12px}.gap16{gap:16px}.gap24{gap:24px}
.grow{flex:1;min-width:0}
.sp{justify-content:space-between}
.center{text-align:center;align-items:center}
.i{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.25;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.fill{fill:currentColor;stroke-width:1}

/* type */
.display{font-size:32px;line-height:40px;font-weight:800}
.title{font-size:26px;line-height:32px;font-weight:800}
.heading{font-size:20px;line-height:28px;font-weight:800}
.sub{font-size:18px;line-height:24px;font-weight:700}
.strong{font-weight:700}
.cap{font-size:14px;line-height:20px}
.tag{font-size:14px;line-height:16px;font-weight:700}
.price{font-size:20px;line-height:24px;font-weight:800;color:var(--brand)}
.hero-price{font-size:40px;line-height:44px;font-weight:800;color:var(--brand)}
.c2{color:var(--ink2)}.c3{color:var(--ink3)}.cb{color:var(--brand)}.cw{color:#fff}

/* controls */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;padding:0 24px;border:0;border-radius:var(--r-md);background:var(--brand);color:#fff;font-size:18px;line-height:24px;font-weight:800;box-shadow:0 4px 0 var(--brand-d);transition:transform .08s,box-shadow .08s}
.btn:active:not([disabled]){transform:translateY(4px);box-shadow:0 0 0 var(--brand-d)}
.btn.sec{background:#fff;color:var(--brand);border:2px solid var(--strong);box-shadow:0 4px 0 var(--line2)}
.btn.sec:active:not([disabled]){box-shadow:0 0 0 var(--line2)}
.btn.danger{background:var(--danger);box-shadow:0 4px 0 var(--danger-d)}
.btn.ghost{background:none;color:var(--brand);box-shadow:none;min-height:48px}
.btn[disabled]{background:var(--line);color:var(--ink3);box-shadow:none;cursor:not-allowed}
.btn.half{width:auto;flex:1;padding:0 12px}
.btn:focus-visible,.tab:focus-visible,.chip:focus-visible,.opt:focus-visible,.iconbtn:focus-visible,.index button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.iconbtn{width:48px;height:48px;border-radius:50%;border:0;background:none;display:flex;align-items:center;justify-content:center;flex:none}
.card{background:#fff;border:2px solid var(--line);border-radius:var(--r-xl);box-shadow:0 4px 0 var(--line2)}
.card.flat{box-shadow:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:14px;line-height:16px;font-weight:700;white-space:nowrap}
.pill .i{width:16px;height:16px;stroke-width:3}
.pill.ok{background:var(--brand-50);color:var(--brand)}
.pill.warn{background:var(--warn-bg);color:var(--warn-fg)}
.pill.danger{background:var(--danger-bg);color:var(--danger-d)}
.pill.caut{background:var(--caut-bg);color:var(--caut-fg)}
.pill.neutral{background:var(--muted);color:var(--ink2)}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;background:#fff;border:2px solid var(--line);font-size:16px;line-height:24px;font-weight:700;white-space:nowrap}
.chip .n{font-size:14px;font-weight:700;color:var(--ink3)}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 3px 0 var(--brand-d)}
.chip.on .n{color:#fff}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-weight:700}
.input{width:100%;min-height:56px;padding:0 16px;border:2px solid var(--strong);border-radius:var(--r-md);background:#fff;font-size:16px;color:var(--ink)}
.input:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
.input::placeholder{color:var(--ink3)}
.input.err{border-color:var(--danger)}
.suffix{position:relative}
.suffix span{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-weight:700;color:var(--ink3)}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:16px;border-radius:var(--r-lg);background:#fff;border:2px solid var(--line);box-shadow:0 3px 0 var(--line2);min-height:64px}
.opt.on{background:var(--brand-50);border-color:var(--brand);box-shadow:0 3px 0 var(--brand)}
.radio{width:24px;height:24px;border-radius:50%;border:2px solid var(--strong);flex:none;display:flex;align-items:center;justify-content:center}
.opt.on .radio{border-color:var(--brand);background:var(--brand)}
.opt.on .radio::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff}
.ibox{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.ibox.ok{background:var(--brand-50);color:var(--brand)}
.ibox.warn{background:var(--warn-bg);color:var(--warn-fg)}
.ibox.caut{background:var(--caut-bg);color:var(--caut-fg)}
.ibox.danger{background:var(--danger-bg);color:var(--danger-d)}
.ibox.sm{width:36px;height:36px}.ibox.sm .i{width:20px;height:20px}
.bar{height:14px;border-radius:99px;background:#fff;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px}
.hdr{display:flex;align-items:center;gap:4px;padding:52px 8px 8px}
.hdr .heading{flex:1}
.tabs{display:flex;background:var(--muted);border-radius:var(--r-md);padding:4px;gap:4px}
.tabs button{flex:1;min-height:48px;border:0;border-radius:12px;background:none;font-weight:700;font-size:16px;color:var(--ink2)}
.tabs button.on{background:#fff;color:var(--brand);box-shadow:0 2px 0 var(--line2)}
.photo{border-radius:var(--r-lg);overflow:hidden;position:relative}
.photo svg{display:block;width:100%;height:100%}
.divider{height:2px;background:var(--line);border-radius:2px}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px;padding:32px 24px}

/* tab bar */
.tabbar{flex:none;display:flex;gap:4px;padding:10px 8px 26px;background:#fff;border-radius:28px 28px 0 0;box-shadow:0 -4px 0 var(--line),0 -16px 28px rgba(28,27,24,.10);position:relative;z-index:10}
.tab{flex:1;min-width:0;min-height:64px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:20px;font-size:14px;line-height:16px;font-weight:600;color:var(--ink2);transition:background .15s,transform .08s,box-shadow .08s}
.tab .tile{display:flex;align-items:center;justify-content:center}
.tab .i{width:26px;height:26px}
.tab:active{transform:translateY(2px)}
.tab.on{background:var(--brand);color:#fff;font-weight:800;box-shadow:0 4px 0 var(--brand-d)}
.tab.on:active{transform:translateY(4px);box-shadow:0 0 0 var(--brand-d)}
.tab .badge{position:absolute;top:4px;right:calc(50% - 30px);background:var(--danger);color:#fff;border-radius:99px;font-size:12px;line-height:16px;min-width:20px;height:20px;padding:0 5px;font-weight:800;border:2px solid #fff;display:flex;align-items:center;justify-content:center}
.tab.on .badge{border-color:var(--brand)}

/* hero */
.hero{background:var(--brand);color:#fff;padding:58px 16px 24px;border-radius:0 0 var(--r-xl) var(--r-xl);display:flex;flex-direction:column;gap:16px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;left:-40px;right:-40px;bottom:-70px;height:110px;border-radius:50%;background:var(--brand-500);opacity:.35;pointer-events:none}
.stat{flex:1;background:#fff;color:var(--ink);border-radius:var(--r-lg);padding:12px;display:flex;flex-direction:column;gap:4px;box-shadow:0 4px 0 var(--brand-900);position:relative;z-index:1}
.stat .n{font-size:26px;line-height:32px;font-weight:800}
.bell{position:relative;width:48px;height:48px;border-radius:50%;background:#fff;color:var(--brand);border:0;display:flex;align-items:center;justify-content:center;flex:none;z-index:1}
.bell i{position:absolute;top:6px;right:8px;width:14px;height:14px;border-radius:50%;background:var(--danger);border:2px solid #fff}
.adv{border-radius:var(--r-xl);padding:16px;display:flex;flex-direction:column;gap:12px;border:2px solid;width:100%;text-align:left}
.adv.caut{background:var(--caut-bg);border-color:var(--caut)}
.adv.warn{background:var(--warn-bg);border-color:var(--warn)}
.adv.ok{background:var(--brand-50);border-color:var(--brand)}
.adv .big{width:64px;height:64px;border-radius:var(--r-lg);display:flex;align-items:center;justify-content:center;flex:none;color:#fff}
.adv.caut .big{background:var(--caut)}.adv.warn .big{background:var(--warn);color:var(--ink)}.adv.ok .big{background:var(--brand)}
.adv .big .i{width:36px;height:36px;stroke-width:2.5}
.adv.caut .lab{color:var(--caut-fg)}.adv.warn .lab{color:var(--warn-fg)}.adv.ok .lab{color:var(--brand)}
.adv.caut .bar>i{background:var(--caut)}.adv.warn .bar>i{background:var(--warn)}.adv.ok .bar>i{background:var(--brand)}
.cta{background:var(--brand-50);border:2px solid var(--brand);border-radius:var(--r-xl);padding:16px;display:flex;flex-direction:column;gap:12px}
.illus{width:84px;height:84px;border-radius:var(--r-lg);background:#fff;display:flex;align-items:center;justify-content:center;flex:none}

/* listing card */
.lcard{overflow:hidden;text-align:left;width:100%;display:block;padding:0;border:2px solid var(--line);border-radius:var(--r-xl);background:#fff;box-shadow:0 4px 0 var(--line2)}
.lcard .photo{height:150px;border-radius:0}
.lcard .ov{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between}
.lcard .ov .pill{box-shadow:0 2px 0 rgba(0,0,0,.12)}
.sticky{position:sticky;bottom:0;background:var(--app);padding:12px 16px;z-index:3}

/* progress (wizard) */
.prog{display:flex;align-items:center;gap:12px;padding:52px 8px 8px 8px}
.prog .track{flex:1;height:16px;border-radius:99px;background:var(--line);overflow:hidden}
.prog .track i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .35s ease;position:relative}
.prog .track i::after{content:"";position:absolute;left:8px;right:8px;top:4px;height:4px;border-radius:4px;background:rgba(255,255,255,.35)}
.slot{aspect-ratio:1/1;border-radius:var(--r-lg);border:3px dashed var(--brand);background:var(--brand-50);color:var(--brand);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:14px;line-height:16px;text-align:center;padding:6px;width:100%;overflow:hidden;position:relative}
.slot.has{border-style:solid;padding:0}
.slot.has .lbl{position:absolute;left:6px;right:6px;bottom:6px;background:rgba(17,41,20,.78);color:#fff;border-radius:99px;padding:4px 6px;font-size:12px;line-height:16px}
.slot.has .ck{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center}
.slot.has .ck .i{width:16px;height:16px;stroke-width:3.5}
.reveal{background:var(--brand);color:#fff;border-radius:var(--r-xl);padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 6px 0 var(--brand-d);animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.reveal .hero-price{color:#fff}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.factor{display:flex;gap:12px;align-items:flex-start}
.factor .ibox{background:rgba(255,255,255,.18);color:#fff}

/* timeline */
.tl{display:flex;flex-direction:column}
.tl .st{display:flex;gap:12px}
.tl .rail{display:flex;flex-direction:column;align-items:center}
.tl .dot{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;border:2px solid var(--line);background:var(--muted);color:var(--ink3);flex:none}
.tl .dot .i{width:18px;height:18px;stroke-width:3.5}
.tl .st.done .dot{background:var(--brand);border-color:var(--brand);color:#fff}
.tl .st.cur .dot{background:#fff;border:3px solid var(--brand);color:var(--brand)}
.tl .line{width:4px;flex:1;min-height:20px;background:var(--line);border-radius:4px;margin:2px 0}
.tl .st.done .line{background:var(--brand)}
.tl .txt{padding-bottom:20px}
.tl .st.up .t{color:var(--ink3)}

/* overlays */
.scrim{position:absolute;inset:0;background:rgba(17,41,20,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease}
.scrim.mid{align-items:center;padding:24px}
.sheet{background:#fff;width:100%;border-radius:var(--r-xl) var(--r-xl) 0 0;padding:20px 16px 32px;display:flex;flex-direction:column;gap:16px;animation:up .25s ease;max-height:92%;overflow:auto}
.dlg{background:#fff;width:100%;border-radius:var(--r-xl);padding:20px 16px 16px;display:flex;flex-direction:column;gap:16px;animation:pop .3s cubic-bezier(.2,1.3,.4,1)}
.dlg .top{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.bigicon{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.bigicon .i{width:40px;height:40px;stroke-width:3}
.bigicon.ok{background:var(--brand);color:#fff}.bigicon.warn{background:var(--warn);color:var(--ink)}.bigicon.danger{background:var(--danger);color:#fff}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(40px)}to{transform:none}}
.toast{position:absolute;left:16px;right:16px;bottom:110px;background:var(--ink);color:#fff;padding:14px 16px;border-radius:var(--r-md);font-weight:700;z-index:30;display:flex;gap:10px;align-items:center;animation:up .25s ease}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:56px;height:56px;border-radius:var(--r-md);border:2px solid var(--strong);background:#fff;box-shadow:0 3px 0 var(--line2);display:flex;align-items:center;justify-content:center;color:var(--brand)}
.stepper button:disabled{opacity:.4}
.stepper .val{flex:1;text-align:center;font-size:32px;line-height:40px;font-weight:800}
.stars{display:flex;gap:6px}
.stars button{border:0;background:none;color:var(--line2);padding:4px}
.stars button.on{color:var(--warn)}
.stars .i{width:40px;height:40px}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;animation:fall 2.6s ease-in forwards}
@keyframes fall{to{transform:translateY(900px) rotate(540deg);opacity:.9}}
.sw{width:56px;height:32px;border-radius:99px;background:var(--line2);position:relative;flex:none}
.hide-m{display:block}

@media (max-width:640px){
  .stage{padding:0;display:block}
  .index{display:none}
  .phone{width:100%;height:100dvh;border:0;border-radius:0;box-shadow:none}
  .status,.dyn{display:none}
  .hdr,.prog{padding-top:16px}
  .hero{padding-top:24px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* buyer additions */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:stretch}
.gcard{display:flex;flex-direction:column;text-align:left;padding:0;border:2px solid var(--line);border-radius:var(--r-lg);background:#fff;box-shadow:0 3px 0 var(--line2);overflow:hidden;width:100%;min-width:0}
.gcard .photo{height:104px;border-radius:0;flex:none}
.gcard .ov{position:absolute;top:8px;left:8px}
.gcard .ov .pill{padding:4px 10px;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.gcard .bd{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hscroll{display:flex;gap:12px;overflow-x:auto;padding:4px 16px 12px;scroll-snap-type:x mandatory;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.rcard{flex:none;width:268px;scroll-snap-align:start;text-align:left;padding:0;border:2px solid var(--line);border-radius:var(--r-xl);background:#fff;box-shadow:0 4px 0 var(--line2);overflow:hidden}
.rcard .photo{position:relative}
.search{display:flex;align-items:center;gap:10px;background:#fff;border-radius:var(--r-md);min-height:56px;padding:0 16px;border:2px solid var(--line2);color:var(--ink3);width:100%;text-align:left;font-size:16px;box-shadow:0 4px 0 var(--brand-900)}
.search input{border:0;outline:0;background:none;font-size:16px;color:var(--ink);width:100%;min-height:52px}
.search:focus-within{border-color:var(--ink)}
.iconbtn .badge{position:absolute;background:var(--danger);color:#fff;border-radius:99px;font-size:12px;line-height:16px;min-width:20px;height:20px;padding:0 5px;font-weight:800;border:2px solid #fff;display:flex;align-items:center;justify-content:center}
@media (max-width:640px){.rcard{width:78vw}}
</style>
</head>

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const ic = (n, c) => `<svg class="i ${c||''}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const peso = n => '₱' + Number(n).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

function mascot(size) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" role="img" aria-label="Animo"><rect width="100" height="100" rx="26" fill="#fff"/><path d="M12 56 L50 20 L88 56 Z" fill="#1a6e1e"/><path d="M8 58 Q50 44 92 58 Q50 68 8 58Z" fill="#1a6e1e"/><path d="M22 54 q4 -14 14 -18 M78 54 q-4 -14 -14 -18" stroke="#c8e6c9" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="50" cy="72" r="17" fill="#fff" stroke="#1a6e1e" stroke-width="5"/><circle cx="43" cy="69" r="3" fill="#1a6e1e"/><circle cx="57" cy="69" r="3" fill="#1a6e1e"/><path d="M42 77 q8 7 16 0" stroke="#1a6e1e" stroke-width="4" fill="none" stroke-linecap="round"/></svg>`;
}
function palay(v) {
  const sets = [['#cfe8a9', '#8cc152', '#e6b422'], ['#f4dfa6', '#d9a441', '#c9821a'], ['#bfe0c4', '#4f9d57', '#e0a82e']];
  const [sky, field, grain] = sets[v % 3];
  let s = '';
  for (let i = 0; i < 9; i++) {
    const x = 20 + i * 44 + (i % 2) * 8, h = 70 + (i * 17) % 50, lean = (i % 3 - 1) * 14;
    s += `<path d="M${x} 220 C${x} ${220 - h * .6} ${x + lean} ${220 - h * .9} ${x + lean * 1.6} ${220 - h * 1.25}" stroke="${field}" stroke-width="4" fill="none" stroke-linecap="round"/>`;
    for (let g = 0; g < 7; g++) {
      const t = g / 6, gx = x + lean * 1.6 * (0.5 + t * .5) + (g % 2 ? 7 : -7), gy = 220 - h * (0.95 + t * .3);
      s += `<ellipse cx="${gx}" cy="${gy}" rx="4.2" ry="8" transform="rotate(${(g % 2 ? 28 : -28)} ${gx} ${gy})" fill="${grain}"/>`;
    }
  }
  return `<svg viewBox="0 0 400 220" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Larawan ng palay"><defs><linearGradient id="g${v}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${sky}"/><stop offset="1" stop-color="#fff8e1"/></linearGradient></defs><rect width="400" height="220" fill="url(#g${v})"/><ellipse cx="200" cy="250" rx="300" ry="70" fill="${field}" opacity=".55"/>${s}</svg>`;
}

const BASE = { Tuyo: 20, Basa: 17 }, PREM = { A: 5, B: 2, C: 0 }, GR = { A: 3, B: 2, C: 1 };
const price = l => BASE[l.moisture] + PREM[l.grade];

const S = {

const reqTotal = r => (r.accKg || r.kg) * price(LI(r.l));
const CANCEL_MS = 30000;

/* ---------- ranking (preferences) ---------- */
function score(l) {
  const p = S.prefs, f = FARM[l.farmer]; let s = 0; const tags = [];
  if (p.types.includes(l.type)) { s += 25; tags.push(l.type); }
  if (p.moisture === 'Kahit alin' || p.moisture === l.moisture) { s += 25; tags.push(l.moisture); }
  if (GR[l.grade] >= GR[p.minGrade]) { s += 20; tags.push('Grado ' + l.grade); }
  if (price(l) <= p.maxPrice) { s += 20; tags.push('Abot sa budget'); }
  if (l.kg >= p.kg) { s += 10; }
  s += Math.round((f.rating - 4) * 5);
  return { s: Math.min(100, s), tags };
}
const recos = () => LIST.map(l => ({ l, ...score(l) })).sort((a, b) => b.s - a.s);

/* ---------- shared pieces ---------- */
function tabbar(a) {
  const items = [['home', 'Tahanan', 'home'], ['market', 'Palengke', 'bag'], ['tx', 'Transaksyon', 'receipt'], ['profile', 'Profile', 'user']];

  return `<nav class="tabbar" aria-label="Pangunahing nabigasyon">${items.map(([k, l, i], x) => `<button class="tab ${x === a ? 'on' : ''}" data-go="${k}" ${x === a ? 'aria-current="page"' : ''} style="position:relative"><span class="tile">${ic(i)}</span>${l}${k === 'tx' && act ? `<span class="badge">${act}</span>` : ''}</button>`).join('')}</nav>`;
}

const PI = { ok: 'check', warn: 'clock', danger: 'x', caut: 'alert', neutral: 'info' };

const stars = (n, sz) => `<span style="display:inline-flex;gap:2px;color:var(--warn)">${[1, 2, 3, 4, 5].map(i => `<svg class="i fill" style="width:${sz || 16}px;height:${sz || 16}px;opacity:${i <= Math.round(n) ? 1 : .25}"><use href="#i-star"/></svg>`).join('')}</span>`;

function gcard(l) {
  const f = FARM[l.farmer];
  return `<button class="gcard" data-act="open" data-id="${l.id}"><div class="photo">${palay(l.img)}<div class="ov">${pill('ok', 'Grado ' + l.grade, 'shield')}</div></div>
  <div class="bd"><div class="strong ell">${esc(l.name)}</div><div class="price">${peso(price(l))}<span class="cap c3" style="font-weight:600">/kg</span></div>
  <div class="cap c2 ell">${l.moisture}, ${num(l.kg)} kg</div>

}
function rcard(x) {
  const l = x.l, f = FARM[l.farmer];
  return `<button class="rcard" data-act="open" data-id="${l.id}"><div class="photo" style="height:120px;border-radius:0">${palay(l.img)}<div class="ov" style="position:absolute;top:10px;left:10px">${pill('ok', 'Tugma ' + x.s + '%', 'check')}</div></div>
  <div class="col gap4" style="padding:12px 14px 14px"><div class="sub ell">${esc(l.name)}</div><div class="row sp"><span class="price">${peso(price(l))}/kg</span><span class="strong cap">${num(l.kg)} kg</span></div>
  <div class="row gap8" style="flex-wrap:wrap;margin-top:4px">${x.tags.slice(0, 3).map(t => `<span class="pill neutral" style="padding:4px 10px">${t}</span>`).join('')}</div>
  <div class="row gap4 cap c2" style="margin-top:6px"><span style="color:var(--warn)">${ic('star', 'fill')}</span><b>${f.rating}</b><span>${esc(f.short)}, ${f.brgy}</span></div></div></button>`;
}

/* ---------- filtering ---------- */
function filtered() {
  const q = S.q.trim().toLowerCase();
  let r = LIST.filter(l => {
    const f = FARM[l.farmer];
    if (q && !(l.name + ' ' + l.variety + ' ' + f.name + ' ' + f.brgy).toLowerCase().includes(q)) return false;
    if (S.fType !== 'all' && l.type !== S.fType) return false;
    if (S.fMoist !== 'all' && l.moisture !== S.fMoist) return false;
    if (S.fGrade !== 'all' && l.grade !== S.fGrade) return false;
    if (price(l) > S.maxPrice) return false;
    return true;
  });
  const sorters = { bago: (a, b) => a.id - b.id, mura: (a, b) => price(a) - price(b), rating: (a, b) => FARM[b.farmer].rating - FARM[a.farmer].rating, dami: (a, b) => b.kg - a.kg };
  return r.sort(sorters[S.sort]);
}
const activeFilters = () => (S.fGrade !== 'all' ? 1 : 0) + (S.maxPrice < 35 ? 1 : 0) + (S.sort !== 'bago' ? 1 : 0);
function resultsHtml() {
  const r = filtered();

}

  <div class="col gap16" style="padding:20px 0 16px">

      <button class="card flat row gap12" data-act="lang" style="padding:14px;width:100%;text-align:left;border-radius:var(--r-lg)"><span class="ibox ok sm">${ic('globe')}</span><span class="grow strong">Wika</span><span class="c2">${S.lang}</span>${ic('chevR')}</button>
      <div class="card flat row gap12" style="padding:14px;border-radius:var(--r-lg)"><span class="ibox ok sm">${ic('phone')}</span><span class="grow strong">Numero ng telepono</span><span class="c2">+63 917 555 0123</span></div>
      <div class="card flat row gap12" style="padding:14px;border-radius:var(--r-lg)"><span class="ibox ok sm">${ic('cash')}</span><span class="grow strong">GCash number</span><span class="c2">0917 555 0123</span></div></div>
    <div class="col gap8"><div class="sub">Legal</div>
      <div class="card flat row gap12" style="padding:14px;border-radius:var(--r-lg)"><span class="ibox ok sm">${ic('receipt')}</span><span class="grow strong">Terms of Service</span>${ic('chevR')}</div>
      <div class="card flat row gap12" style="padding:14px;border-radius:var(--r-lg)"><span class="ibox ok sm">${ic('shield')}</span><span class="grow strong">Privacy Policy</span>${ic('chevR')}</div></div>
    <button class="btn sec" data-act="signout" style="color:var(--danger-d);border-color:var(--danger)">${ic('logout')} Mag-sign out</button></div>`;
};

/* ---------- modals ---------- */
const optBtn = (on, act, v, text, extra) => `<button class="chip ${on ? 'on' : ''}" data-act="${act}" data-v="${v}" ${extra || ''}>${text}</button>`;
function modalHtml() {
  const m = S.modal; if (!m) return '';
  if (m === 'filter') { const n = filtered().length; return `<div class="scrim" data-act="closeModal"><div class="sheet" role="dialog" aria-modal="true" aria-label="Mga Filter">
    <div class="row sp"><div class="heading">Mga Filter</div><button class="btn ghost" style="width:auto;padding:0 8px;font-size:16px;min-height:40px" data-act="resetF">I-reset</button></div>
    <div class="col gap8"><div class="strong">Moisture</div><div class="row gap8">${['all', 'Tuyo', 'Basa'].map(v => optBtn(S.fMoist === v, 'fMoist', v, v === 'all' ? 'Lahat' : v)).join('')}</div></div>
    <div class="col gap8"><div class="strong">Purity grade</div><div class="row gap8">${['all', 'A', 'B', 'C'].map(v => optBtn(S.fGrade === v, 'fGrade', v, v === 'all' ? 'Lahat' : 'Grado ' + v)).join('')}</div></div>
    <div class="col gap8"><div class="row sp"><span class="strong">Pinakamataas na presyo</span><span class="strong cb" id="pv">${peso(S.maxPrice)}/kg</span></div><input type="range" min="17" max="35" step="1" value="${S.maxPrice}" data-in="maxPrice" aria-label="Pinakamataas na presyo" style="width:100%;accent-color:var(--brand);height:32px"></div>
    <div class="col gap8"><div class="strong">Ayusin ayon sa</div>${[['bago', 'Pinakabago'], ['mura', 'Pinakamura'], ['rating', 'Pinakamataas ang rating'], ['dami', 'Pinakamaraming dami']].map(([v, t]) => `<button class="opt ${S.sort === v ? 'on' : ''}" data-act="sort" data-v="${v}" style="min-height:56px;padding:12px 16px"><span class="radio"></span><span class="strong grow">${t}</span></button>`).join('')}</div>
    <button class="btn" data-act="closeModal" id="fapply">Ipakita ang ${n} resulta</button></div></div>`; }
  if (m === 'prefs') { const d = S.pd; return `<div class="scrim" data-act="closeModal"><div class="sheet" role="dialog" aria-modal="true" aria-label="Kagustuhan sa Pagbili">
    <div class="heading">Kagustuhan sa Pagbili</div><div class="c2">Gagamitin ito para i-rank ang Mga Rekomendasyon.</div>
    <div class="col gap8"><div class="strong">Uri ng palay</div><div class="row gap8">${['Inbred', 'Hybrid'].map(v => optBtn(d.types.includes(v), 'pType', v, v)).join('')}</div></div>
    <div class="col gap8"><div class="strong">Moisture</div><div class="row gap8" style="flex-wrap:wrap">${['Tuyo', 'Basa', 'Kahit alin'].map(v => optBtn(d.moisture === v, 'pMoist', v, v)).join('')}</div></div>
    <div class="col gap8"><div class="strong">Pinakamababang grado</div><div class="row gap8">${['A', 'B', 'C'].map(v => optBtn(d.minGrade === v, 'pGrade', v, 'Grado ' + v)).join('')}</div></div>
    <div class="col gap8"><div class="strong">Pinakamataas na presyo bawat kilo</div><div class="stepper"><button data-act="pPrice" data-d="-1" aria-label="Bawasan">${ic('minus')}</button><div class="val">${peso(d.maxPrice)}</div><button data-act="pPrice" data-d="1" aria-label="Dagdagan">${ic('plus')}</button></div></div>
    <div class="col gap8"><div class="strong">Karaniwang dami</div><div class="stepper"><button data-act="pKg" data-d="-50" aria-label="Bawasan">${ic('minus')}</button><div class="val">${num(d.kg)}<span class="cap c3"> kg</span></div><button data-act="pKg" data-d="50" aria-label="Dagdagan">${ic('plus')}</button></div></div>
    <button class="btn" data-act="savePrefs" ${d.types.length ? '' : 'disabled'}>I-save ang Kagustuhan</button></div></div>`; }
  if (m === 'cancel') return `<div class="scrim mid" data-act="closeModal"><div class="dlg" role="dialog" aria-modal="true"><div class="top"><span class="bigicon warn">${ic('alert')}</span><div class="heading">Kanselahin ang kahilingan?</div><div class="c2">Hindi ito makikita ng magsasaka kung kakanselahin mo ngayon.</div></div><button class="btn danger" data-act="doCancel">Oo, Kanselahin</button><button class="btn sec" data-act="closeModal">Huwag Muna</button></div></div>`;
  if (m === 'signout') return `<div class="scrim mid" data-act="closeModal"><div class="dlg" role="dialog" aria-modal="true"><div class="top"><span class="bigicon danger">${ic('logout')}</span><div class="heading">Mag-sign out?</div><div class="c2">Kailangan mong mag-login ulit gamit ang OTP.</div></div><button class="btn danger" data-act="closeModal">Mag-sign out</button><button class="btn sec" data-act="closeModal">Manatili</button></div></div>`;
  if (m === 'lang') return `<div class="scrim" data-act="closeModal"><div class="sheet" role="dialog" aria-modal="true" aria-label="Wika"><div class="heading">Piliin ang wika</div>${['Tagalog', 'English'].map(x => `<button class="opt ${S.lang === x ? 'on' : ''}" data-act="setLang" data-v="${x}"><span class="radio"></span><span class="strong grow">${x}</span></button>`).join('')}<button class="btn" data-act="closeModal">Tapos na</button></div></div>`;
  return '';
}

/* ---------- render ---------- */
const TABS = { home: 0, notif: 0, market: 1, detail: 1, farmer: 1, req: 1, sent: 2, tx: 2, txd: 2, receipt: 2, profile: 3 };
const NOTAB = ['req', 'sent'];
const LIGHT = ['home', 'profile', 'farmer'];
let lastScreen = null;
function render(keepScroll) {
  const sc = $('#screen'); const st = sc.scrollTop;
  sc.innerHTML = screens[S.screen]() + modalHtml() + (S.toast ? `<div class="toast">${ic('check')}${S.toast}</div>` : '');
  $('#status').className = 'status' + (LIGHT.includes(S.screen) ? ' light' : '');
  $('#tabslot').innerHTML = NOTAB.includes(S.screen) ? '' : (TABS[S.screen] !== undefined ? tabbar(TABS[S.screen]) : '');
  sc.scrollTop = keepScroll && lastScreen === S.screen ? st : 0; lastScreen = S.screen;
  renderIndex();
}
function go(s) { S.screen = s; S.modal = null; render(); }
function toast(t) { S.toast = t; render(true); clearTimeout(toast.h); toast.h = setTimeout(() => { S.toast = null; render(true); }, 2200); }

/* ---------- 30 second cancel window ---------- */
function tick() {
  const now = Date.now(); let expired = false;
  S.requests.forEach(r => { if (r.status === 'window' && now >= r.endsAt) { r.status = 'waiting'; expired = true; } });
  if (S.screen === 'sent') {
    const r = R_();
    if (r.status === 'window') {
      const left = Math.max(0, r.endsAt - now), C = 2 * Math.PI * 54;
      const n = $('#cdnum'), ring = $('#cdring');
      if (n) n.textContent = Math.ceil(left / 1000);
      if (ring) ring.setAttribute('stroke-dashoffset', C * (1 - left / CANCEL_MS));
    } else if (expired) { S.modal = null; render(true); }
  } else if (expired) { toast('Naipadala na sa magsasaka ang kahilingan'); }
}
setInterval(tick, 250);

/* ---------- index ---------- */
const INDEX = [
  ['Tahanan', [['Tahanan at mga rekomendasyon', () => go('home')]]],
  ['Palengke', [['Mag-browse', () => { resetF(); go('market'); }], ['Mga filter (sheet)', () => { resetF(); go('market'); S.modal = 'filter'; render(); }], ['Walang nahanap', () => { resetF(); S.q = 'zzz'; go('market'); }]]],
  ['Listing at magsasaka', [['Detalye ng listing', () => { S.sel = 1; S.gallery = 0; go('detail'); }], ['Profile ng magsasaka', () => { S.selFarmer = 1; go('farmer'); }]]],
  ['Kahilingan sa Pagbili', [['Pumili ng dami', () => { S.sel = 1; S.qty = 100; go('req'); }], ['30 segundong kansel', () => { startReq(1, 100, 24000); }], ['Pagkatapos ng 30 segundo', () => { startReq(1, 100, -1); tick(); }], ['Kanselahin (dialog)', () => { startReq(1, 100, 20000); S.modal = 'cancel'; render(); }]]],
  ['Transaksyon', [['Aktibo', () => { S.txTab = 'active'; go('tx'); }], ['Kasaysayan', () => { S.txTab = 'history'; go('tx'); }], ['Tinanggap, magbayad', () => { S.selReq = 0; go('txd'); }], ['Naghihintay ng sagot', () => { S.selReq = 1; go('txd'); }], ['Resibo at review', () => { S.selReq = 2; S.stars = 0; go('receipt'); }]]],
  ['Mensahe at Profile', [['Mensahe', () => { S.notifEmpty = false; go('notif'); }], ['Walang mensahe', () => { S.notifEmpty = true; go('notif'); }], ['Profile', () => go('profile')], ['Kagustuhan sa pagbili', () => { go('profile'); acts.editPrefs(); }], ['Piliin ang wika', () => { go('profile'); S.modal = 'lang'; render(); }], ['Mag-sign out', () => { go('profile'); S.modal = 'signout'; render(); }]]]
];
let idxMap = [];
function renderIndex() {
  idxMap = []; let h = `<h1>Animo, Mamimili</h1><p>Buong module ng Mamimili. Subukan ang mga button sa loob ng telepono.</p>`;
  INDEX.forEach(([g, items]) => { h += `<h2>${g}</h2>`; items.forEach(([l, fn]) => { idxMap.push(fn); h += `<button data-idx="${idxMap.length - 1}">${l}</button>`; }); });
  $('#index').innerHTML = h;
}
function resetF() { S.q = ''; S.fType = 'all'; S.fMoist = 'all'; S.fGrade = 'all'; S.maxPrice = 35; S.sort = 'bago'; }
function startReq(lid, kg, ms) {
  const id = Math.max(...S.requests.map(r => r.id)) + 1;
  S.requests.unshift({ id, l: lid, kg, status: 'window', step: 1, endsAt: Date.now() + ms, date: 'Ngayon' });
  S.sentId = id; S.selReq = 0; go('sent');
}

/* ---------- actions ---------- */
const acts = {
  open(e) { S.sel = +e.dataset.id; S.gallery = 0; go('detail'); },
  gal(e) { S.gallery = +e.dataset.i; render(true); },
  farmer(e) { S.selFarmer = +e.dataset.id; go('farmer'); },
  chip(e) { const v = e.dataset.v; if (v === 'all') { S.fType = 'all'; S.fMoist = 'all'; } else if (v === 'Inbred' || v === 'Hybrid') S.fType = S.fType === v ? 'all' : v; else S.fMoist = S.fMoist === v ? 'all' : v; render(true); },
  openFilter() { S.modal = 'filter'; render(true); },
  fMoist(e) { S.fMoist = e.dataset.v; render(true); },
  fGrade(e) { S.fGrade = e.dataset.v; render(true); },
  sort(e) { S.sort = e.dataset.v; render(true); },
  resetF() { resetF(); S.modal = null; render(true); },
  startReq() { const l = LI(S.sel); S.qty = Math.min(100, l.kg); go('req'); },
  qty(e) { const l = LI(S.sel); S.qty = Math.min(l.kg, Math.max(50, S.qty + (+e.dataset.d))); render(true); },
  qtyset(e) { S.qty = +e.dataset.v; render(true); },
  submitReq() { startReq(S.sel, S.qty, CANCEL_MS); },
  askCancel() { S.modal = 'cancel'; render(true); },
  doCancel() { const r = S.screen === 'sent' ? R_() : S.requests[S.selReq]; r.status = 'cancelled'; S.modal = null; if (S.screen === 'txd') render(true); else render(); toast('Nakansela ang kahilingan'); },
  viewReq(e) { const i = S.requests.findIndex(r => r.id === +e.dataset.id); S.selReq = i; go('txd'); },
  txTab(e) { S.txTab = e.dataset.v; render(true); },
  demoAccept() { const r = S.requests[S.selReq]; r.status = 'accepted'; r.step = 3; r.accKg = Math.max(50, r.kg - 50); r.paid = false; render(); toast('Tinanggap ng magsasaka ang kahilingan'); },
  copy() { toast('Nakopya ang GCash number'); },
  markPaid() { S.requests[S.selReq].paid = true; render(true); toast('Naitala ang bayad'); },
  confirmPickup() { const r = S.requests[S.selReq]; r.status = 'complete'; r.step = 4; r.reviewed = false; render(); toast('Kumpleto na ang transaksyon'); },
  toReceipt() { S.stars = 0; go('receipt'); },
  star(e) { S.stars = +e.dataset.v; render(true); },
  sendReview() { S.requests[S.selReq].reviewed = true; S.stars = 0; S.review = ''; render(true); toast('Naipadala ang review'); },
  readN(e) { S.notifs.find(x => x.id === +e.dataset.id).read = true; render(true); },
  readAll() { S.notifs.forEach(n => n.read = true); render(true); },
  editPrefs() { S.pd = JSON.parse(JSON.stringify(S.prefs)); S.modal = 'prefs'; render(true); },
  pType(e) { const t = S.pd.types, v = e.dataset.v; S.pd.types = t.includes(v) ? t.filter(x => x !== v) : [...t, v]; render(true); },
  pMoist(e) { S.pd.moisture = e.dataset.v; render(true); },
  pGrade(e) { S.pd.minGrade = e.dataset.v; render(true); },
  pPrice(e) { S.pd.maxPrice = Math.min(35, Math.max(17, S.pd.maxPrice + (+e.dataset.d))); render(true); },
  pKg(e) { S.pd.kg = Math.min(1000, Math.max(50, S.pd.kg + (+e.dataset.d))); render(true); },
  savePrefs() { S.prefs = S.pd; S.modal = null; render(true); toast('Na-save ang kagustuhan mo'); },
  lang() { S.modal = 'lang'; render(true); },
  setLang(e) { S.lang = e.dataset.v; render(true); },
  signout() { S.modal = 'signout'; render(true); },
  closeModal(el, ev) { if (el.classList.contains('scrim') && ev && ev.target !== el) return; S.modal = null; render(true); }
};
document.addEventListener('click', e => {
  const idx = e.target.closest('[data-idx]'); if (idx) { idxMap[+idx.dataset.idx](); return; }
  const a = e.target.closest('[data-act]'); if (a && acts[a.dataset.act]) { e.stopPropagation(); acts[a.dataset.act](a, e); return; }
  const g = e.target.closest('[data-go]'); if (g) go(g.dataset.go);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset && t.dataset.q !== undefined) { S.q = t.value; const r = $('#results'); if (r) r.innerHTML = resultsHtml(); return; }
  const k = t.dataset && t.dataset.in; if (!k) return;
  if (k === 'review') { S.review = t.value; return; }
  if (k === 'maxPrice') { S.maxPrice = +t.value; const pv = $('#pv'); if (pv) pv.textContent = peso(S.maxPrice) + '/kg'; const b = $('#fapply'); if (b) b.textContent = `Ipakita ang ${filtered().length} resulta`; }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.modal) { S.modal = null; render(true); } });
window.__S = S;
render();

</script>
</body>
</html>
